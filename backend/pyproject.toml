[project]
name = "collab-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.15",
  "djangorestframework-simplejwt>=5.3",
  "django-environ>=0.11",
  "django-cors-headers>=4.4",
  "drf-spectacular>=0.27",
  "psycopg[binary]>=3.2",
  "uuid6>=2024.7.10",
  "requests>=2.32",
  "django-otp>=1.5",
  "qrcode>=7.4",
  "gunicorn>=26.2.0",
  "uvicorn[standard]>=0.54.0",
  "whitenoise>=6.12.0",
  "pillow>=13.0.0",
  "channels>=4.1",
  "channels-redis>=4.2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-django>=4.9",
  "pytest-cov>=5",
  "factory-boy>=3.3",
  "ruff>=0.6",
  "bandit>=1.9.4",
  "pip-audit>=2.10.1",
  "pytest-asyncio>=1.4.1.post1",
  "daphne>=4.2.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --reuse-db"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["apps", "tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "DJ"]
ignore = ["S101", "S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]
"**/migrations/**" = ["E501"]

[tool.coverage.run]
source = ["apps"]
omit = ["*/migrations/*", "*/tests/*"]
