          enum:
          - instagram
          - youtube
          - tiktok
          - other
          type: string
          minLength: 1
        description: |-
          * `instagram` - Instagram
          * `youtube` - YouTube
          * `tiktok` - TikTok
          * `other` - Other
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - in: query
        name: verified
        schema:
          type: boolean
      tags:
      - creators
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
