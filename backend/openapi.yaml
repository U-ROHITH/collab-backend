          type: integer
          minimum: 0
          nullable: true
        deliveryDays:
          type: integer
          maximum: 90
          minimum: 1
      required:
      - deliveryDays
      - message
      - price
    BidOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        campaignId:
          type: string
          format: uuid
        creator:
          type: object
          additionalProperties: {}
          readOnly: true
        price:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        message:
          type: string
          maxLength: 2000
        expectedViews:
          type: integer
        deliveryDays:
          type: integer
        status:
          $ref: '#/components/schemas/BidOutputStatusEnum'
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        createdAt:
          type: string
          format: date-time
      required:
      - campaignId
      - createdAt
      - creator
      - deliveryDays
      - expectedViews
      - id
      - message
      - price
