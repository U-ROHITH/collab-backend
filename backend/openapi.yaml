          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequestInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationRequestOutput'
          description: ''
  /v1/auth/email/verify/:
