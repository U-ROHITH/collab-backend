  /v1/creators/me/campaigns/:
    get:
      operationId: creators_me_campaigns_list
      description: 'GET: brand -> its campaigns; approved creator -> open campaigns.
        POST: brand creates.'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
