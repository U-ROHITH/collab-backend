      description: 'GET: brand -> its campaigns; approved creator -> open campaigns.
        POST: brand creates.'
      tags:
      - creators
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOutput'
          description: ''
  /v1/creators/me/offers/:
