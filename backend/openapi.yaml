openapi: 3.0.3
info:
  title: Collab API
  version: 1.0.0
paths:
  /v1/auth/google/:
    post:
      operationId: auth_google_create
      description: POST {idToken, role?} -> {access, refresh, user}, same shape as
        OTP verify.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleSignInInputRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensOutput'
          description: ''
  /v1/auth/login/:
    post:
      operationId: auth_login_create
      description: POST {identifier, password} -> {access, refresh, user}. `identifier`
        is an email or mobile number.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInputRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensOutput'
          description: ''
  /v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /v1/auth/logout-all/:
    post:
      operationId: auth_logout_all_create
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOutput'
          description: ''
  /v1/auth/otp/request/:
    post:
      operationId: auth_otp_request_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequestInputRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestOutput'
          description: ''
  /v1/auth/otp/verify/:
    post:
      operationId: auth_otp_verify_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyInputRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensOutput'
          description: ''
  /v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      description: |-
        POST {currentPassword?, password, confirmPassword} -> {access, refresh, user}.

        `currentPassword` may be left out within 10 minutes of signing in with a code or Google; otherwise
        403 REAUTH_REQUIRED. Signs out every other session; store the returned tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensOutput'
          description: ''
  /v1/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        POST {challengeId, code, password, confirmPassword} -> {access, refresh, user}.

        Forgot password: get a code from /otp/request/ first. Signs out every other session.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetInputRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensOutput'
          description: ''
  /v1/auth/signup/complete/:
    post:
      operationId: auth_signup_complete_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCompleteInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOutput'
          description: ''
  /v1/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: POST {refresh} -> {access, refresh}. Refresh tokens rotate; the
        old one is blacklisted.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /v1/brands/{brand_id}/:
    get:
      operationId: brands_retrieve
      description: |-
        A brand's public profile (name, logo, industry, website, city).

        Creators can see it once they have an offer, order or conversation with that brand. Open
        campaigns stay anonymous (blind bidding), so a bid alone doesn't reveal the brand.
        Brands can view their own.
      parameters:
      - in: path
        name: brand_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - brands
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPublic'
          description: ''
  /v1/brands/me/:
    get:
      operationId: brands_me_retrieve
      tags:
      - brands
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandOutput'
          description: ''
    patch:
      operationId: brands_me_partial_update
      tags:
      - brands
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBrandInputRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandOutput'
          description: ''
  /v1/campaigns/:
    get:
      operationId: campaigns_list
      description: |-
        GET: brand -> its campaigns; approved creator -> open campaigns; anyone else (guests included)
        -> open campaigns with the brief and usage rights hidden. POST: brand creates.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - campaigns
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignOutputList'
          description: ''
    post:
      operationId: campaigns_create
      description: |-
        GET: brand -> its campaigns; approved creator -> open campaigns; anyone else (guests included)
        -> open campaigns with the brief and usage rights hidden. POST: brand creates.
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOutput'
          description: ''
  /v1/campaigns/{campaign_id}/:
    get:
      operationId: campaigns_retrieve
      description: GET is public for open campaigns, with the same guest view as the
        list; brands see their own in any status.
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOutput'
          description: ''
    patch:
      operationId: campaigns_partial_update
      description: GET is public for open campaigns, with the same guest view as the
        list; brands see their own in any status.
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCampaignInputRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOutput'
          description: ''
  /v1/campaigns/{campaign_id}/bids/:
    get:
      operationId: campaigns_bids_list
      description: 'GET: brand -> all bids on its campaign; creator -> only its own
        bid. POST: approved creator bids.'
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - campaigns
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBidOutputList'
          description: ''
    post:
      operationId: campaigns_bids_create
      description: 'GET: brand -> all bids on its campaign; creator -> only its own
        bid. POST: approved creator bids.'
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidOutput'
          description: ''
  /v1/campaigns/{campaign_id}/bids/{bid_id}/:
    patch:
      operationId: campaigns_bids_partial_update
      parameters:
      - in: path
        name: bid_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBidInputRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidOutput'
          description: ''
  /v1/campaigns/{campaign_id}/bids/{bid_id}/select/:
    post:
      operationId: campaigns_bids_select_create
      parameters:
      - in: path
        name: bid_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderOutput'
          description: ''
  /v1/campaigns/{campaign_id}/bids/{bid_id}/withdraw/:
    post:
      operationId: campaigns_bids_withdraw_create
      parameters:
      - in: path
        name: bid_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidOutput'
          description: ''
  /v1/campaigns/{campaign_id}/close/:
    post:
      operationId: campaigns_close_create
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOutput'
          description: ''
  /v1/cart/:
    get:
      operationId: cart_list
      tags:
      - cart
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItemOutput'
          description: ''
    post:
      operationId: cart_create
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartAddInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemOutput'
          description: ''
  /v1/cart/{item_id}/:
    delete:
      operationId: cart_destroy
      parameters:
      - in: path
        name: item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cart
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /v1/cart/checkout/:
    post:
      operationId: cart_checkout_create
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderOutput'
          description: ''
  /v1/conversations/:
    get:
      operationId: conversations_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - conversations
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversationOutputList'
          description: ''
    post:
      operationId: conversations_create
      tags:
      - conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationOpenInputRequest'
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOutput'
          description: ''
  /v1/conversations/{conversation_id}/:
    get:
      operationId: conversations_retrieve
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - conversations
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationOutput'
          description: ''
  /v1/conversations/{conversation_id}/dates/:
    get:
      operationId: conversations_dates_list
      description: 'Calendar support: the IST days that have messages, with counts.
        Optional ?month=YYYY-MM.'
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - conversations
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MessageDay'
          description: ''
  /v1/conversations/{conversation_id}/messages/:
    get:
      operationId: conversations_messages_list
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - conversations
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageOutputList'
          description: ''
    post:
      operationId: conversations_messages_create
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessageInputRequest'
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageOutput'
          description: ''
  /v1/conversations/{conversation_id}/read/:
    post:
      operationId: conversations_read_create
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - conversations
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /v1/creators/:
    get:
      operationId: creators_list
      description: 'Discovery: approved creators only. Public (guest view); the card
        never includes contact or payout info.'
      parameters:
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
          maxLength: 40
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 500
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 50
          minimum: 1
      - in: query
        name: location
        schema:
          type: string
          minLength: 1
          maxLength: 80
      - in: query
        name: maxPrice
        schema:
          type: integer
          minimum: 0
      - in: query
        name: minFollowers
        schema:
          type: integer
          minimum: 0
      - in: query
        name: minPrice
        schema:
          type: integer
          minimum: 0
      - in: query
        name: platform
        schema:
          enum:
          - instagram
          - youtube
          - other
          type: string
          minLength: 1
        description: |-
          * `instagram` - Instagram
          * `youtube` - YouTube
          * `other` - Other
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - in: query
        name: verified
        schema:
          type: boolean
      tags:
      - creators
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreatorCardOutputList'
          description: ''
  /v1/creators/{creator_id}/:
    get:
      operationId: creators_retrieve
      description: Public profile of an approved creator (guest view).
      parameters:
      - in: path
        name: creator_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - creators
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorDetailOutput'
          description: ''
  /v1/creators/{creator_id}/reviews/:
    get:
      operationId: creators_reviews_list
      parameters:
      - in: path
        name: creator_id
        schema:
          type: string
          format: uuid
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - creators
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedReviewOutputList'
          description: ''
  /v1/creators/me/:
    get:
      operationId: creators_me_retrieve
      tags:
      - creators
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorSelfOutput'
          description: ''
    patch:
      operationId: creators_me_partial_update
      tags:
      - creators
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCreatorProfileInputRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorSelfOutput'
          description: ''
  /v1/creators/me/bids/:
    get:
      operationId: creators_me_bids_list
      description: 'GET: the signed-in creator''s bids, newest first, each with its
        campaign (brand hidden: blind bidding).'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - creators
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMyBidOutputList'
          description: ''
  /v1/creators/me/campaigns/:
    get:
      operationId: creators_me_campaigns_list
      description: 'GET: the signed-in creator''s bids, newest first, each with its
        campaign (brand hidden: blind bidding).'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - creators
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMyBidOutputList'
          description: ''
  /v1/creators/me/earnings/:
    get:
      operationId: creators_me_earnings_retrieve
      description: |-
        Creator's earnings summary. `payoutsEnabled` is false until Razorpay Route payouts ship;
        hide withdraw/payout-history screens until it flips.
      tags:
      - creators
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorEarnings'
          description: ''
  /v1/creators/me/media/{media_id}/:
    delete:
      operationId: creators_me_media_destroy
      parameters:
      - in: path
        name: media_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - creators
      security:
      - bearerAuth: []
      responses:
        '204':
          description: No response body
  /v1/creators/me/offers/:
    get:
      operationId: creators_me_offers_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - creators
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
