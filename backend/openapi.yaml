components:
  schemas:
    AuthTokensOutput:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
        user:
          $ref: '#/components/schemas/MeOutput'
      required:
      - access
      - refresh
      - user
    BankInputRequest:
      type: object
      properties:
        accountHolderName:
          type: string
          minLength: 1
          maxLength: 120
        accountNumber:
          type: string
          minLength: 1
          description: 9-18 digits
          pattern: ^\d{9,18}$
        ifsc:
          type: string
          minLength: 1
          maxLength: 11
      required:
      - accountHolderName
      - accountNumber
      - ifsc
    BidInputRequest:
      type: object
      properties:
        price:
          type: integer
          maximum: 1000000000
          minimum: 100
        message:
          type: string
          minLength: 1
          maxLength: 2000
        expectedViews:
          type: integer
          minimum: 0
          nullable: true
        deliveryDays:
          type: integer
          maximum: 90
          minimum: 1
      required:
      - deliveryDays
      - message
      - price
    BidOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        campaignId:
          type: string
          format: uuid
        creator:
          type: object
          additionalProperties: {}
          readOnly: true
        price:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        message:
          type: string
          maxLength: 2000
        expectedViews:
          type: integer
        deliveryDays:
          type: integer
        status:
          $ref: '#/components/schemas/Status779Enum'
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        createdAt:
          type: string
          format: date
          readOnly: true
      required:
      - campaignId
      - createdAt
      - creator
      - deliveryDays
      - expectedViews
      - id
      - message
      - price
    BillingAddressInputRequest:
      type: object
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 80
        state:
          type: string
          minLength: 1
          maxLength: 80
        pincode:
          type: string
          minLength: 1
          pattern: ^[1-9][0-9]{5}$
      required:
      - city
      - line1
      - pincode
      - state
    BlankEnum:
      enum:
      - ''
    BrandOutput:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 120
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 300
          - type: string
            maxLength: 0
        industry:
          type: string
          maxLength: 80
        logoUrl:
          type: string
        legalName:
          type: string
        gstin:
          type: string
          maxLength: 15
        stateCode:
          type: string
        billingAddress: {}
      required:
      - billingAddress
      - id
      - legalName
      - logoUrl
      - name
      - stateCode
    BrandPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logoUrl:
          type: string
          format: uri
          nullable: true
        industry:
          type: string
        website:
          type: string
          format: uri
          nullable: true
        city:
          type: string
      required:
      - city
      - id
      - industry
      - logoUrl
      - name
      - website
    CampaignInputRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        brief:
          type: string
          minLength: 1
          maxLength: 5000
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        deliverables:
          type: string
          minLength: 1
          maxLength: 200
        budgetMin:
          type: integer
          maximum: 1000000000
          minimum: 100
        budgetMax:
          type: integer
          maximum: 1000000000
          minimum: 100
        closesAt:
          type: string
          format: date
          description: YYYY-MM-DD; bidding closes at the end of that day (IST)
        status:
          allOf:
          - $ref: '#/components/schemas/CampaignInputStatusEnum'
          default: open
