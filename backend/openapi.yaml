        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderOutput'
          description: ''
  /v1/creators/:
    get:
      operationId: creators_list
      description: 'Discovery: approved creators only. Visible to signed-up brands
        and creators.'
      parameters:
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
          maxLength: 40
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 500
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 50
          minimum: 1
      - in: query
        name: location
        schema:
          type: string
          minLength: 1
          maxLength: 80
      - in: query
        name: maxPrice
        schema:
          type: integer
          minimum: 0
      - in: query
        name: minFollowers
        schema:
          type: integer
          minimum: 0
      - in: query
        name: minPrice
        schema:
          type: integer
          minimum: 0
      - in: query
        name: platform
        schema:
          enum:
          - instagram
          - youtube
          - other
          type: string
          minLength: 1
        description: |-
          * `instagram` - Instagram
          * `youtube` - YouTube
          * `other` - Other
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - in: query
        name: verified
        schema:
          type: boolean
      tags:
      - creators
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCreatorCardOutputList'
          description: ''
