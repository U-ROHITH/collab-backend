      operationId: creators_me_offers_list
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - creators
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOfferOutputList'
          description: ''
  /v1/creators/me/offers/{offer_id}/:
    patch:
      operationId: creators_me_offers_partial_update
      parameters:
      - in: path
        name: offer_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - creators
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOfferResponseInputRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferResponse'
          description: ''
  /v1/creators/me/orders/:
    get:
      operationId: creators_me_orders_list
      description: 'Brand: orders it bought. Creator: orders it fulfils. Also served
        at /creators/me/orders/.'
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
          maxLength: 500
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 50
          minimum: 1
      - in: query
        name: status
        schema:
          enum:
          - awaiting_payment
          - funded
          - draft_submitted
          - revision_requested
          - approved
          - completed
          - cancelled
          - refund_pending
          - refunded
          - disputed
          type: string
          minLength: 1
        description: |-
          * `awaiting_payment` - Awaiting Payment
          * `funded` - Funded
          * `draft_submitted` - Draft Submitted
          * `revision_requested` - Revision Requested
          * `approved` - Approved
          * `completed` - Completed
          * `cancelled` - Cancelled
          * `refund_pending` - Refund Pending
          * `refunded` - Refunded
          * `disputed` - Disputed
      tags:
      - creators
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrderOutputList'
          description: ''
