          minLength: 1
          maxLength: 80
      - in: query
        name: maxPrice
        schema:
          type: integer
          minimum: 0
      - in: query
        name: minFollowers
        schema:
          type: integer
          minimum: 0
      - in: query
        name: minPrice
        schema:
          type: integer
          minimum: 0
      - in: query
