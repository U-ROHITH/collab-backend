          format: uuid
        required: true
      tags:
      - campaigns
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderOutput'
          description: ''
  /v1/campaigns/{campaign_id}/bids/{bid_id}/withdraw/:
    post:
      operationId: campaigns_bids_withdraw_create
      parameters:
      - in: path
        name: bid_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidOutput'
          description: ''
  /v1/campaigns/{campaign_id}/close/:
    post:
      operationId: campaigns_close_create
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOutput'
          description: ''
  /v1/cart/:
    get:
      operationId: cart_list
      tags:
      - cart
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CartItemOutput'
          description: ''
    post:
      operationId: cart_create
      tags:
      - cart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartAddInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItemOutput'
          description: ''
  /v1/cart/{item_id}/:
