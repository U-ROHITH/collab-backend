          type: string
        user:
          $ref: '#/components/schemas/MeOutput'
      required:
      - access
      - refresh
      - user
    BidInputRequest:
      type: object
      properties:
        price:
          type: integer
          maximum: 1000000000
          minimum: 100
        message:
          type: string
          minLength: 1
          maxLength: 2000
