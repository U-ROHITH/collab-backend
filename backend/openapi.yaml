      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBrandInputRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandOutput'
          description: ''
  /v1/campaigns/:
    get:
      operationId: campaigns_list
      description: 'GET: brand -> its campaigns; approved creator -> open campaigns.
        POST: brand creates.'
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - campaigns
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignOutputList'
          description: ''
    post:
      operationId: campaigns_create
      description: 'GET: brand -> its campaigns; approved creator -> open campaigns.
        POST: brand creates.'
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOutput'
          description: ''
  /v1/campaigns/{campaign_id}/:
    get:
      operationId: campaigns_retrieve
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOutput'
          description: ''
    patch:
      operationId: campaigns_partial_update
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCampaignInputRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOutput'
          description: ''
  /v1/campaigns/{campaign_id}/bids/:
    get:
      operationId: campaigns_bids_list
      description: 'GET: brand -> all bids on its campaign; creator -> only its own
        bid. POST: approved creator bids.'
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - campaigns
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBidOutputList'
          description: ''
    post:
      operationId: campaigns_bids_create
      description: 'GET: brand -> all bids on its campaign; creator -> only its own
        bid. POST: approved creator bids.'
      parameters:
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BidInputRequest'
        required: true
      security:
      - bearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidOutput'
          description: ''
  /v1/campaigns/{campaign_id}/bids/{bid_id}/:
    patch:
      operationId: campaigns_bids_partial_update
      parameters:
      - in: path
        name: bid_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: campaign_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBidInputRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BidOutput'
          description: ''
  /v1/campaigns/{campaign_id}/bids/{bid_id}/select/:
    post:
      operationId: campaigns_bids_select_create
      parameters:
      - in: path
        name: bid_id
