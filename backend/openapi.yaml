  /v1/campaigns/:
    get:
      operationId: campaigns_list
      description: 'GET: public/anon -> open campaigns; brand -> its campaigns. POST:
        brand creates.'
      parameters:
      - in: query
        name: budgetMax
        schema:
          type: integer
          minimum: 0
      - in: query
        name: budgetMax__lte
        schema:
          type: integer
          minimum: 0
      - in: query
        name: budgetMin
        schema:
          type: integer
          minimum: 0
      - in: query
        name: budgetMin__gte
        schema:
          type: integer
          minimum: 0
      - in: query
        name: category
        schema:
          type: string
          minLength: 1
          maxLength: 80
      - in: query
        name: city
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - in: query
        name: cursor
        schema:
          type: string
          minLength: 1
      - in: query
        name: industry
        schema:
          type: string
          minLength: 1
          maxLength: 80
      - in: query
        name: limit
        schema:
          type: integer
          maximum: 50
          minimum: 1
      - in: query
        name: location
        schema:
          type: string
          minLength: 1
          maxLength: 100
      - in: query
        name: maxBudget
        schema:
          type: integer
          minimum: 0
      - in: query
        name: minBudget
        schema:
          type: integer
          minimum: 0
      - in: query
        name: ordering
        schema:
          type: string
          minLength: 1
          maxLength: 50
      - in: query
        name: platform
        schema:
          enum:
          - instagram
          - youtube
          - tiktok
          - other
          type: string
          minLength: 1
        description: |-
          * `instagram` - Instagram
          * `youtube` - YouTube
          * `tiktok` - TikTok
          * `other` - Other
      - in: query
        name: q
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - in: query
        name: sort
        schema:
          type: string
          minLength: 1
          maxLength: 50
      - in: query
        name: status
        schema:
          type: string
          minLength: 1
          maxLength: 20
      - in: query
        name: territory
        schema:
          type: string
          minLength: 1
          maxLength: 100
      tags:
      - campaigns
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignOutputList'
          description: ''
    post:
      operationId: campaigns_create
      description: 'GET: public/anon -> open campaigns; brand -> its campaigns. POST:
        brand creates.'
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignInputRequest'
        required: true
      security:
      - bearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignOutput'
          description: ''
  /v1/campaigns/{campaign_id}/:
